<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Users — Street 160</title>
  <link rel="stylesheet" href="../css/style.css?v=3"/>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>

<div id="alert" class="alert"></div>

<main class="main-content">
  <div class="page-header">
    <div>
      <h2 class="page-title">User Management</h2>
      <p class="page-sub">Manage admin and staff accounts.</p>
    </div>
    <button class="btn btn-primary" onclick="toggleForm()">+ Add User</button>
  </div>

  <!-- Form -->
  <div id="form-card" class="card highlight" style="margin-bottom:20px;display:none">
    <div style="font-size:14px;font-weight:600;margin-bottom:16px" id="form-title">New User</div>
    <div class="form-grid cols-2">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" id="f-name" class="form-input" placeholder="e.g. John Doe"/>
      </div>
      <div class="form-group">
        <label class="form-label">Username *</label>
        <input type="text" id="f-username" class="form-input" placeholder="e.g. john123"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email *</label>
        <input type="email" id="f-email" class="form-input" placeholder="staff@street160.lk"/>
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select id="f-role" class="form-select">
          <option value="staff">Staff</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:10px">
      <button class="btn btn-primary" onclick="saveUser()">Save User</button>
      <button class="btn btn-ghost" onclick="cancelForm()">Cancel</button>
    </div>
    <input type="hidden" id="f-id"/>
  </div>

  <!-- Table -->
  <div class="card">
    <div id="loading" class="loading"><div class="spinner"></div>Loading users…</div>
    <div class="table-wrap" id="table-wrap" style="display:none">
      <table>
        <thead><tr>
          <th>#</th><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Created</th><th>Actions</th>
        </tr></thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  requireAuth();
  requireAdmin();
  renderSidebar('users');

  let users = [];
  const currentUser = getUser();

  async function loadUsers() {
    try {
      const res = await api.getUsers();
      users = res.data || res;
      renderTable();
      setLoading('loading', false);
      document.getElementById('table-wrap').style.display = 'block';
    } catch(e) {
      document.getElementById('loading').innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
    }
  }

  function renderTable() {
    const tbody = document.getElementById('users-tbody');
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:32px">No users found</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(u => `
      <tr>
        <td style="color:var(--muted)">${u.id}</td>
        <td style="font-weight:600">${u.name}</td>
        <td style="color:var(--muted)">${u.username}</td>
        <td style="color:var(--muted)">${u.email}</td>
        <td>${statusBadge(u.role)}</td>
        <td style="color:var(--muted);font-size:12px">${(u.created_at||'').slice(0,10)}</td>
        <td>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" onclick="editUser(${u.id})">Edit</button>
            ${u.id != currentUser?.id
              ? `<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">Remove</button>`
              : `<span style="font-size:12px;color:var(--muted);padding:4px 8px">(You)</span>`}
          </div>
        </td>
      </tr>
    `).join('');
  }

  function toggleForm() {
    cancelForm();
    document.getElementById('form-card').style.display = 'block';
  }

  function cancelForm() {
    document.getElementById('form-card').style.display = 'none';
    ['f-id','f-name','f-username','f-email'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-role').value = 'staff';
    document.getElementById('form-title').textContent = 'New User';
  }

  function editUser(id) {
    const u = users.find(x => x.id === id);
    if (!u) return;
    document.getElementById('f-id').value       = u.id;
    document.getElementById('f-name').value     = u.name;
    document.getElementById('f-username').value = u.username;
    document.getElementById('f-email').value    = u.email;
    document.getElementById('f-role').value     = u.role;
    document.getElementById('form-title').textContent = 'Edit User';
    document.getElementById('form-card').style.display = 'block';
    window.scrollTo(0, 0);
  }

  async function saveUser() {
    const id       = document.getElementById('f-id').value;
    const name     = document.getElementById('f-name').value.trim();
    const username = document.getElementById('f-username').value.trim();
    const email    = document.getElementById('f-email').value.trim();
    const role     = document.getElementById('f-role').value;

    if (!name || !username || !email) {
      showAlert('alert', 'Name, username, and email are required.', 'danger');
      return;
    }

    const payload = { name, username, email, role };

    try {
      if (id) { await api.put(`/users/${id}`, payload); showAlert('alert', 'User updated.', 'success'); }
      else    { await api.createUser(payload);           showAlert('alert', 'User created.', 'success'); }
      cancelForm();
      loadUsers();
    } catch(e) { showAlert('alert', e.message, 'danger'); }
  }

  async function deleteUser(id) {
    if (!(await customConfirm('Remove this user? This action cannot be undone.'))) return;
    try {
      await api.deleteUser(id);
      showAlert('alert', 'User removed.', 'success');
      loadUsers();
    } catch(e) { showAlert('alert', e.message, 'danger'); }
  }

  loadUsers();
</script>
</body>
</html>
