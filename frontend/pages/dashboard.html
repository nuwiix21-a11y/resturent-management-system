<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Street 160</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<main class="main-content">
  <div class="page-header">
    <div>
      <h2 class="page-title">Dashboard</h2>
      <p class="page-sub">Welcome back! Here's what's happening today.</p>
    </div>
  </div>

  <div id="loading" class="loading"><div class="spinner"></div>Loading data…</div>

  <div id="content" style="display:none">
    <!-- Stats -->
    <div class="stats-row" id="stats-row"></div>

    <!-- Two panels -->
    <div class="grid-2">
      <div class="card">
        <div style="font-size:14px;font-weight:600;margin-bottom:16px">Recent Orders</div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Order #</th><th>Type</th><th>Total</th><th>Status</th>
            </tr></thead>
            <tbody id="recent-orders"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:600;margin-bottom:16px">Order Status Overview</div>
        <div id="status-bars"></div>
      </div>
    </div>
  </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  requireAuth();
  renderSidebar('dashboard');

  async function loadDashboard() {
    try {
      const [ordersRes, menuRes] = await Promise.all([
        api.getOrders(),
        api.getMenuItems(),
      ]);
      const orders = ordersRes.data || ordersRes;
      const menu   = menuRes.data   || menuRes;

      const today     = new Date().toISOString().slice(0, 10);
      const todayOrds = orders.filter(o => o.created_at?.startsWith(today));
      const revenue   = todayOrds.filter(o => o.status === 'completed').reduce((s, o) => s + parseFloat(o.total), 0);
      const pending   = orders.filter(o => o.status === 'pending').length;
      const preparing = orders.filter(o => o.status === 'preparing').length;
      const unavail   = menu.filter(m => !m.is_available).length;

      // Stats
      document.getElementById('stats-row').innerHTML = `
        ${statCard('Today\'s Revenue', 'Rs. ' + revenue.toLocaleString(), '', 'gold')}
        ${statCard('Today\'s Orders', todayOrds.length, 'Total placed today', 'var(--info)')}
        ${statCard('Pending Orders', pending, preparing + ' preparing', 'var(--warning)')}
        ${statCard('Menu Items', menu.length, unavail + ' unavailable', 'var(--success)')}
      `;

      // Recent orders table
      const recentHTML = [...orders].reverse().slice(0, 6).map(o => `
        <tr>
          <td style="color:var(--gold);font-weight:700">#${o.id}</td>
          <td>${o.type === 'dine_in' ? 'Table ' + o.table_number : 'Takeaway'}</td>
          <td style="font-weight:600">Rs. ${parseFloat(o.total).toLocaleString()}</td>
          <td>${statusBadge(o.status)}</td>
        </tr>
      `).join('');
      document.getElementById('recent-orders').innerHTML = recentHTML || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">No orders yet</td></tr>';

      // Status bars
      const statuses = ['completed','preparing','pending','cancelled'];
      const colors   = { completed:'var(--success)', preparing:'var(--warning)', pending:'var(--info)', cancelled:'var(--danger)' };
      const total    = orders.length || 1;
      document.getElementById('status-bars').innerHTML = statuses.map(s => {
        const count = orders.filter(o => o.status === s).length;
        return `
          <div style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
              <span style="text-transform:capitalize;color:var(--muted)">${s}</span>
              <span style="color:${colors[s]};font-weight:600">${count}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="background:${colors[s]};width:${(count/total)*100}%"></div>
            </div>
          </div>`;
      }).join('');

      setLoading('loading', false);
      document.getElementById('content').style.display = 'block';
    } catch(e) {
      document.getElementById('loading').innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
    }
  }

  function statCard(label, value, sub, color) {
    return `
      <div class="stat-card">
        <div>
          <div class="stat-label">${label}</div>
          <div class="stat-value" style="color:${color === 'gold' ? 'var(--gold)' : color}">${value}</div>
          ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
        </div>
        <div class="stat-icon" style="background:${color === 'gold' ? 'rgba(212,168,83,0.12)' : color + '18'};color:${color === 'gold' ? 'var(--gold)' : color}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        </div>
      </div>`;
  }

  loadDashboard();
</script>
</body>
</html>
